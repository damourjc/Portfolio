<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Portfolio - Compétences - Jean-Cédric</title>

<link rel="stylesheet" href="css/main.css">

<!-- Police Tourney -->
<link href="https://fonts.googleapis.com/css2?family=Tourney:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>

    <canvas id="particles"></canvas>

    <div class="cursor"></div>

    <nav class="navbar">
        <a href="home.html">Accueil</a>
        <a href="projets.html">Projets</a>
        <a href="competences.html">Compétences</a>
    </nav>

    <!-- COMPETENCES -->
    <section class="hidden holographic"> <!-- .hidden : invisible au départ - devient visible avec animation (scroll.js) / .holographic : style visuel spécial (effet futuriste)-->
        <div class="hud-window">
            <div class="hud-lines"></div>
            <div class="scan-line"></div>
            <div class="hud-header">
                <h2 class="gradient-text">Compétences</h2>

                <div class="hud-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <div class="hud-grid"> <!-- structure en colonnes-->

                <!-- Bloc 1 -->
                <div class="skills-container"></div> <!-- ce conteneur est vide / il est rempli par JavaScript / via MVC : renderSkills(skills); dans : skillsView.js-->

                <!-- Bloc 2 -->
                <div>
                    <ul class="traits"> <!-- liste simple : pas dynamique / purement statique-->
                        <li>✔️ Créatif</li>
                        <li>✔️ Persévérant</li>
                        <li>⚠️ Perfectionniste</li>
                    </ul>
                </div>

            </div>

        </div>

        <div class="hud-window">
            <div class="hud-lines"></div>
            <div class="scan-line"></div>
            <div class="hud-header">
                <h2 class="gradient-text">Profil</h2>
            </div>

            <canvas id="chart"></canvas> <!-- utilisé par : initChart(); dans : chart-config.js / librairie utilisé : voir le lien en-dessous / Résultats : graphique radar-->

        </div>
    </section>
    <section>
        <div class="hud-window">
            <div class="hud-header">
                <h2 class="gradient-text">Terminal</h2>
            </div>

            <div class="terminal-box">
                <div id="terminal-output"></div>
                <input type="text" id="terminal-input" placeholder="Tape une commande...">
            </div>
        </div>
    </section>

    <script type="module" src="js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- <audio id="hoverSound" src="hover.mp3"></audio>
    <audio id="clickSound" src="click.mp3"></audio> -->

</body>
</html>
