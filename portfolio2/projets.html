<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">                                                              <!-- Même commentaire que index.html-->
<title>Portfolio - Projets - Jean-Cédric</title>

<link rel="stylesheet" href="css/main.css">

<!-- Police Tourney -->
<link href="https://fonts.googleapis.com/css2?family=Tourney:wght@400;700&display=swap" rel="stylesheet">

</head>

<body>

    <canvas id="particles"></canvas>

    <div class="cursor"></div>

    <nav class="navbar">
        <a href="home.html">Accueil</a>
        <a href="projets.html">Projets</a>
        <a href="competences.html">Compétences</a>
    </nav>

    <!-- PROJETS -->
    <section class="hidden">
        <div class="hud-window">                        <!-- c’est une "fenêtre" style interface futuriste / design contrôlé par hud.css / comportement interactif via hud.js-->
            <div class="hud-lines"></div>               <!-- hud-lines → grille/lignes-->  
            <div class="scan-line"></div>               <!-- scan-line → effet scan (comme un radar)-->
            <div class="hud-header">                    <!-- zone du haut (comme une fenêtre Windows)-->
                <h2 class="gradient-text">Projets</h2>

                <div class="hud-dots">                  <!-- imite : fermer / réduire / agrandir - purement esthétique-->
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <div id="projects-container" class="hud-grid"> <!-- id="projects-container" → utilisé par MVC / hud-grid → layout (grille CSS)-->
                                                           <!-- Ce bloc est : rempli dynamiquement par JavaScript via : renderProjects(projects); dans : projectsView.js-->
                <div class="project-card">                  <!-- carte de projet-->
                    <img src="projet1.png" alt="Projet">

                    <div class="project-content">
                        <h3>Projet 1</h3>
                        <p>
                            Création d’un portfolio futuriste avec animations,
                            effets interactifs et structure multi-pages.
                        </p>
                    </div>
                </div>

                <div class="project-card">
                    <img src="projet2.png" alt="Projet">

                    <div class="project-content">
                        <h3>Projet 2</h3>
                        <p>Description...</p>
                    </div>
                </div>

            </div>

        </div>
    </section>

    <script type="module" src="js/main.js"></script>

    <audio id="hoverSound" src="hover.mp3"></audio>
    <audio id="clickSound" src="click.mp3"></audio>

</body>
</html>
